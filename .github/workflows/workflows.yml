# The light check of a pull request that changes only workflows, Dependabot's action moves above all: every step pinned,
# and every workflow a file GitHub can read. It builds nothing, publishes nothing and holds no secret, so the operator
# can merge an action move on it alone. The Build leaves such a pull request to it.
name: Workflow check

on:
  pull_request:
    branches: ['**']
    paths: ['.github/**']

permissions:
  contents: read

jobs:
  check:
    name: Workflow check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The release tooling this check runs: a release on Central, never the snapshot the pom names.
      BUILDTOOLS_VERSION: 0.5.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The wrapper's Maven, fetched once per pin: without it every job fetched it with one wget and no retry, and a
      # single network hiccup failed a Build (2026-11-06).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ runner.os }}-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      # Maven's local repository for the release tooling, kept by the pom and the tooling's version that name what it
      # holds: without it every run fetched the tooling and its plugins from Central. A moved pin gives a new key; the
      # newest older entry seeds it, the old one is read no more, and GitHub drops it seven days after its last read.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-repository-ci-tools-${{ runner.os }}-${{ env.BUILDTOOLS_VERSION }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-repository-ci-tools-${{ runner.os }}-

      # The wrapper checks its Maven against distributionSha256Sum and installs it only whole, so asking it again after
      # a failed fetch is a retry; a cached one answers at once.
      - name: The wrapper's Maven
        run: |
          set -eu
          for attempt in 1 2 3 4 5; do
              if JAVA_HOME="$JAVA_HOME_25_X64" ./mvnw -B -q --version >/dev/null; then
                  break
              fi
              if [ "$attempt" = 5 ]; then
                  echo "::error::the wrapper could not fetch its Maven in 5 attempts"
                  exit 1
              fi
              echo "::warning::the wrapper's Maven did not arrive (attempt $attempt); trying again"
              sleep $((attempt * 10))
          done

      # The runner's own Java 25, as the Build uses, and the release tooling from this pom's ci-tools profile. This
      # repository reads Central alone, so the tooling is a release there, never the snapshot the pom names.
      - name: Resolve the release tooling
        run: |
          JAVA_HOME="$JAVA_HOME_25_X64" ./mvnw -B -q -Pci-tools -s settings.xml dependency:build-classpath \
              -Dporelo.buildtools.version="$BUILDTOOLS_VERSION" -Dmdep.outputFile=target/cp.txt

      - name: Every step pinned to a commit
        run: '"$JAVA_HOME_25_X64/bin/java" -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-actions'

      # A file that does not load, or names no trigger or no job, is a workflow GitHub would not run.
      - name: Every workflow loads, with its triggers and jobs
        run: |
          python3 - <<'PY'
          import pathlib, sys, yaml
          bad = []
          for path in sorted(pathlib.Path(".github/workflows").glob("*.y*ml")):
              try:
                  loaded = yaml.safe_load(path.read_text())
              except yaml.YAMLError as error:
                  bad.append(f"{path}: {error}")
                  continue
              # YAML 1.1 reads the key 'on' as true.
              triggers = loaded.get("on", loaded.get(True)) if isinstance(loaded, dict) else None
              if not triggers or not isinstance(loaded.get("jobs"), dict) or not loaded["jobs"]:
                  bad.append(f"{path}: names no trigger or no job")
              else:
                  print(f"OK    {path}")
          for line in bad:
              print(f"ERROR {line}", file=sys.stderr)
          sys.exit(1 if bad else 0)
          PY
