# The parent pom, built on main, a tag and a pull request, and published: a snapshot from main, a release from a tag.
# A branch's commit builds once, as its pull request, not again as a push.
name: Build

on:
  push:
    branches: [main]
    # A release: v<version>, published to Central's releases.
    tags: ['v*']
    # The image a Porelo task builds in changes no build here. Workflows alone build nothing either: an action's move
    # is checked by its pull request's Workflow check, and the next push with content builds with it.
    paths-ignore: ['porelo.yml', '.github/**']
  pull_request:
    branches: ['**']
    paths-ignore: ['porelo.yml', '.github/**']
  workflow_dispatch:

# One run per branch. Runs queue rather than cancel each other, so a newer push cannot kill Publish halfway through.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

# Read for the workflow as a whole; a job that needs to write says so in its own block.
permissions:
  contents: read

jobs:

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The wrapper's Maven, fetched once per pin: without it every job fetched it with one wget and no retry, and a
      # single network hiccup failed a Build (2026-11-06).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ runner.os }}-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      # Maven's local repository, for the build and the children its tests build, kept by the poms and the test scripts
      # that name what it holds: without it every run fetched each plugin and dependency from Central. A moved pom gives
      # a new key; the newest older entry seeds it, the old one is read no more, and GitHub drops it seven days after
      # its last read, so only the newest entry is kept.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-repository-${{ runner.os }}-${{ hashFiles('**/pom.xml', 'test/*.sh') }}
          restore-keys: maven-repository-${{ runner.os }}-

      # The wrapper checks its Maven against distributionSha256Sum and installs it only whole, so asking it again after
      # a failed fetch is a retry; a cached one answers at once.
      - name: The wrapper's Maven
        run: |
          set -eu
          for attempt in 1 2 3 4 5; do
              if JAVA_HOME="$JAVA_HOME_25_X64" ./mvnw -B -q --version >/dev/null; then
                  break
              fi
              if [ "$attempt" = 5 ]; then
                  echo "::error::the wrapper could not fetch its Maven in 5 attempts"
                  exit 1
              fi
              echo "::warning::the wrapper's Maven did not arrive (attempt $attempt); trying again"
              sleep $((attempt * 10))
          done

      # The runner's own Java 25, and the Maven the wrapper pins: the runner's Maven is whatever its image carries.
      - name: Build
        run: JAVA_HOME="$JAVA_HOME_25_X64" ./mvnw -B -s settings.xml verify

      # The repository was renamed: no tracked file says the old name.
      - name: No file says the old name
        run: test/no-old-name.sh

      # What a child inherits under the release profile: the publishing plugin, as an extension, in its own build.
      - name: A child can publish
        run: JAVA_HOME="$JAVA_HOME_25_X64" test/child-publishes.sh

      # What a child inherits under the forge profile: an unsigned snapshot deploy to MAVEN_SNAPSHOTS_URL, if it opts in.
      - name: A child can deploy to a forge
        run: JAVA_HOME="$JAVA_HOME_25_X64" test/child-deploys-to-forge.sh

      # A child that names spotless-maven-plugin fails 'validate' on a misformatted Java file, and only then.
      - name: A misformatted Java file fails validate
        run: JAVA_HOME="$JAVA_HOME_25_X64" test/misformatted-java-fails.sh

      # The shfmt the pom pins, which Spotless does not download, kept by the digest its release names: fetched only on
      # a miss, and checked against the digest after a hit too. A moved pin gives a new key; the old entry is read no
      # more and GitHub drops it seven days after its last read.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: shfmt-cache
        with:
          path: ~/.cache/porelo-pinned/shfmt
          key: pinned-shfmt-d9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea

      - name: The pinned shfmt
        env:
          CACHE_HIT: ${{ steps.shfmt-cache.outputs.cache-hit }}
        run: |
          set -eu
          VERSION="$(sed -n 's|^ *<shfmt.version>\(.*\)</shfmt.version>$|\1|p' pom.xml)"
          [ "$VERSION" = 3.12.0 ] || { echo "::error::pom.xml pins shfmt $VERSION; this step installs 3.12.0"; exit 1; }
          KEPT="$HOME/.cache/porelo-pinned/shfmt/shfmt"
          if [ "$CACHE_HIT" != true ]; then
              mkdir -p "$(dirname "$KEPT")"
              curl -fsSL --retry 5 --retry-all-errors -o "$KEPT" \
                  "https://github.com/mvdan/sh/releases/download/v$VERSION/shfmt_v${VERSION}_linux_amd64"
          fi
          echo "d9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea  $KEPT" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$KEPT" "$RUNNER_TEMP/bin/shfmt"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Only a download that passed its digest: the step above failing ends the job before this.
      - if: steps.shfmt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/porelo-pinned/shfmt
          key: pinned-shfmt-d9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea

      # A child that names spotless-maven-plugin fails 'validate' on a misformatted shell script.
      - name: A misformatted shell script fails validate
        run: JAVA_HOME="$JAVA_HOME_25_X64" test/misformatted-shell-fails.sh

  deploy:
    name: Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [build]
    if: >-
      github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A tag publishes a release, main a snapshot. A release is refused unless the tag is exactly 'v' plus the
      # version it carries, and a version is never a release and a snapshot at once.
      - name: Which channel
        run: |
          set -eu
          VERSION="$(sed -n 's|^    <version>\(.*\)</version>$|\1|p' pom.xml | head -1)"
          [ -n "$VERSION" ] || { echo "::error::no version in pom.xml"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
              [ "$GITHUB_REF_NAME" = "v$VERSION" ] \
                  || { echo "::error::the tag $GITHUB_REF_NAME is not v$VERSION, the version this commit carries"; exit 1; }
              case "$VERSION" in
                  *-SNAPSHOT) echo "::error::$VERSION is a snapshot; a release carries its own version"; exit 1 ;;
              esac
          else
              case "$VERSION" in
                  *-SNAPSHOT) ;;
                  *) echo "::error::$VERSION on a branch would publish a release as a snapshot"; exit 1 ;;
              esac
          fi
          echo "  publishing $VERSION"

      # The wrapper's Maven, fetched once per pin: without it every job fetched it with one wget and no retry, and a
      # single network hiccup failed a Build (2026-11-06).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ runner.os }}-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      # Maven's local repository for publishing, under a key of its own: the build's key would always hit here and never
      # save what Publish adds. Kept by the deploy profile and the poms that name what it holds: without it every run
      # fetched each plugin and dependency from Central. A moved pom gives a new key; the newest older entry seeds it,
      # the old one is read no more, and GitHub drops it seven days after its last read, so only the newest entry is
      # kept.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-repository-publish-${{ runner.os }}-${{ vars.PORELO_DEPLOY_PROFILE }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-repository-publish-${{ runner.os }}-${{ vars.PORELO_DEPLOY_PROFILE }}-

      # The wrapper checks its Maven against distributionSha256Sum and installs it only whole, so asking it again after
      # a failed fetch is a retry; a cached one answers at once.
      - name: The wrapper's Maven
        run: |
          set -eu
          for attempt in 1 2 3 4 5; do
              if JAVA_HOME="$JAVA_HOME_25_X64" ./mvnw -B -q --version >/dev/null; then
                  break
              fi
              if [ "$attempt" = 5 ]; then
                  echo "::error::the wrapper could not fetch its Maven in 5 attempts"
                  exit 1
              fi
              echo "::warning::the wrapper's Maven did not arrive (attempt $attempt); trying again"
              sleep $((attempt * 10))
          done

      # Signed by the plugin's BouncyCastle signer, which reads the armored key and its passphrase from this step's
      # environment and keeps them in the build's memory: the private key is never written to the runner's disk.
      # The forge names the profile: central-sonatype-release on GitHub, forge-release on the local forge.
      - name: Publish
        env:
          PORELO_DEPLOY_PROFILE: ${{ vars.PORELO_DEPLOY_PROFILE }}
          MAVEN_SNAPSHOTS_URL: ${{ vars.MAVEN_SNAPSHOTS_URL }}
          PORELO_PUBLISHER_TOKEN: ${{ secrets.PORELO_PUBLISHER_TOKEN }}
          OSS_SONATYPE_USERNAME: ${{ secrets.OSS_SONATYPE_USERNAME }}
          OSS_SONATYPE_TOKEN: ${{ secrets.OSS_SONATYPE_TOKEN }}
          MAVEN_GPG_KEY: ${{ secrets.OSS_SONATYPE_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSS_SONATYPE_GPG_PASSPHRASE }}
        run: |
          set -eu
          case "$PORELO_DEPLOY_PROFILE" in
              central-sonatype-release | forge-release) ;;
              *) echo "::error::PORELO_DEPLOY_PROFILE is '$PORELO_DEPLOY_PROFILE', not central-sonatype-release or forge-release"; exit 1 ;;
          esac
          JAVA_HOME="$JAVA_HOME_25_X64" ./mvnw -B -s settings.xml deploy -P"$PORELO_DEPLOY_PROFILE" -Dgpg.signer=bc -Dmaven.deploy.skip=false -DskipPublishing=false
